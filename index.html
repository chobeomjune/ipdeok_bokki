<!DOCTYPE html>

    <!-- 메인 페이지 CSS -->

<body>

        <!-- 슬라이드 메뉴 -->

                <span class="side-menu-title">MENU</span>

                <button
                    type="button"
                    class="menu-close-button"
                    id="menuClose"
                    aria-label="메뉴 닫기"
                >
                    &times;
                </button>

            </div>

            <ul class="side-menu-list">

                <li>

                    </a>
                </li>

                <li>
                    <a href="detail.html" class="side-menu-link">
                        상세 페이지
                    </a>
                </li>

                <li>
                    <a href="payment.html" class="side-menu-link">

                    </a>
                </li>

                <li>
                    <a href="payment_finish.html" class="side-menu-link">
                        결제 완료 페이지
                    </a>

            </ul>

        </nav>

    </div>


    <!-- HERO -->
    <section class="hero">
        <div class="hero-image"></div>
    </section>


    <!-- SECTION 1 : ORDER -->
    <section class="order-section">

        <div class="order-buttons">

            <a href="#" class="order-button order-button-main">

                            stroke-width="3.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"/>
                        <path d="M16 36H36"
                            stroke="currentColor"
                            stroke-width="3.5"
                            stroke-linecap="round"/>
                        <circle cx="19" cy="41" r="2.5" fill="currentColor"/>
                        <circle cx="34" cy="41" r="2.5" fill="currentColor"/>
                    </svg>
                </span>

                <span>배달 주문하기</span>

            </a>

            <div class="order-button-row">

                <a href="#" class="order-button">
                    <span class="phone-icon" aria-hidden="true">♧</span>
                    <span>전화 주문</span>
                </a>

                <a href="#" class="order-button">
                    <span class="coupon-icon" aria-hidden="true">%</span>
                    <span>쿠폰 사용</span>

    </section>


    <!-- SECTION 2 : RECOMMEND -->
    <section class="recommend-section">

        <h2 class="section-title">추천 메뉴</h2>

        <div class="hashtag-list">

            <button type="button" class="hashtag active">

            <button type="button" class="hashtag">

        <div class="recommend-carousel">

            <div class="recommend-card recommend-card-side left"></div>

            <div class="recommend-card recommend-card-main">

                    <span class="recommend-label">BEST 1</span>

                    <p class="recommend-name">

                    </p>

                    <a href="detail.html" class="recommend-button">

                    </a>

                <div class="recommend-image-placeholder"></div>

            </div>

            <div class="recommend-card recommend-card-side right"></div>

        </div>

    </section>


    <!-- SECTION 3 : MENU -->
    <section class="menu-section">

        <h2 class="section-title">메뉴</h2>

        <div class="hashtag-list">

            <button type="button" class="hashtag active">
                메뉴 1
            </button>

            <button type="button" class="hashtag">
                메뉴 2
            </button>

            <button type="button" class="hashtag">
                메뉴 3
            </button>

        </div>

        <div class="menu-grid">

            <a href="lists.html" class="menu-item">
                <div class="menu-image-placeholder"></div>
                <p class="menu-item-title">떡볶이 타이틀 작성</p>
            </a>

            <a href="lists.html" class="menu-item">
                <div class="menu-image-placeholder"></div>
                <p class="menu-item-title">떡볶이 타이틀 작성</p>
            </a>

            <a href="lists.html" class="menu-item">
                <div class="menu-image-placeholder"></div>
                <p class="menu-item-title">떡볶이 타이틀 작성</p>
            </a>

            <a href="lists.html" class="menu-item">
                <div class="menu-image-placeholder"></div>
                <p class="menu-item-title">떡볶이 타이틀 작성</p>
            </a>

        </div>

    </section>


    <!-- SECTION 4 : EVENT -->
    <section class="event-section">

        <div class="event-heading">

            <h2 class="section-title">이벤트</h2>

            <p class="event-description">
                매달 추가되는 입덕볶이의 이벤트를 만나보세요!
            </p>

        </div>

        <div class="event-tabs">

            <button type="button" class="event-tab active">
                진행중
            </button>

            <button type="button" class="event-tab">
                종료
            </button>

            <button type="button" class="event-tab">
                당첨자
            </button>

        </div>

        <div class="event-list">

            <a href="#" class="event-card">

                <div class="event-image-placeholder"></div>

                <div class="event-content">

                    <p class="event-subtitle">
                        [할인중 이벤트]
                    </p>

                    <h3 class="event-title">
                        매달 추가되는 입덕볶이의 이벤트 내역입니다
                        자세한 내용은 이벤..
                    </h3>

                    <p class="event-date">
                        2026.11.23 - 2026.12.31
                    </p>

                </div>

            </a>

        </div>

    </section>

</div>


<!-- JAVASCRIPT : SIDE MENU -->
<script>

    const menuOpen = document.getElementById('menuOpen');
    const menuClose = document.getElementById('menuClose');
    const menuLayer = document.getElementById('menuLayer');
    const menuOverlay = document.getElementById('menuOverlay');
    const sideMenuLinks = document.querySelectorAll('.side-menu-link');


    // 메뉴 열기
    function openMenu() {

        menuLayer.classList.add('is-open');

        menuLayer.setAttribute('aria-hidden', 'false');

        menuOpen.setAttribute('aria-expanded', 'true');

        document.body.classList.add('menu-open');

    }


    // 메뉴 닫기
    function closeMenu() {

        menuLayer.classList.remove('is-open');

        menuLayer.setAttribute('aria-hidden', 'true');

        menuOpen.setAttribute('aria-expanded', 'false');

        document.body.classList.remove('menu-open');

    }


    // 햄버거 버튼 클릭
    menuOpen.addEventListener('click', openMenu);


    // 닫기 버튼 클릭
    menuClose.addEventListener('click', closeMenu);


    // 메뉴 외부 배경 클릭
    menuOverlay.addEventListener('click', closeMenu);


    // 메뉴 항목 클릭
    sideMenuLinks.forEach(function(link) {

        link.addEventListener('click', function() {

            closeMenu();

        });

    });


    // ESC 키로 메뉴 닫기
    document.addEventListener('keydown', function(event) {

        if (event.key === 'Escape') {

            closeMenu();

        }

    });

</script>

</body>
</html>
